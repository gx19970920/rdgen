name: 'Decrypt and Mask Secrets'
description: 'Decrypts a zip and masks the JSON contents as env vars'
inputs:
  zip_password:
    description: 'Password for the Zip'
    required: true
  zip_path:
    description: 'Path to the encrypted zip'
    required: false
    default: 'secrets.zip'

runs:
  using: "composite"
  steps:
    - name: install python deps
      shell: bash
      run: |
        pip install pyzipper==0.4.0
    - name: Decrypt and Mask
      shell: python
      env:
        INPUT_ZIP_PASSWORD: ${{ inputs.zip_password }}
        INPUT_ZIP_PATH: ${{ inputs.zip_path }}
      run: |
        import pyzipper
        import json
        import os
        import re
        import secrets
        import shutil
        import sys
        from pathlib import Path

        # Windows runners may use a legacy code page, so emit workflow commands as UTF-8.
        for stream in (sys.stdout, sys.stderr):
            if hasattr(stream, 'reconfigure'):
                stream.reconfigure(encoding='utf-8')

        asset_dir = Path(os.environ['RUNNER_TEMP']) / 'rdgen-assets'
        asset_dir.mkdir(parents=True, exist_ok=True)

        with pyzipper.AESZipFile(os.environ['INPUT_ZIP_PATH']) as zf:
            zf.setpassword(os.environ['INPUT_ZIP_PASSWORD'].encode())
            with zf.open('secrets.json') as f:
                secret_values = json.load(f)
            for asset_name in ('icon.png', 'logo.png', 'privacy.png'):
                if asset_name in zf.namelist():
                    with zf.open(asset_name) as source, (asset_dir / asset_name).open('wb') as target:
                        shutil.copyfileobj(source, target)

        action_path = Path(os.environ['GITHUB_ACTION_PATH'])
        webdav_script = action_path.parent.parent / 'scripts' / 'upload_webdav.py'
        shutil.copy2(webdav_script, asset_dir / webdav_script.name)
        for source in (action_path.parent.parent / 'patches').iterdir():
            if source.is_file():
                shutil.copy2(source, asset_dir / source.name)

        def escape_workflow_command(value):
            return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

        def write_multiline_env(env_file, key, value):
            if not re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*', key):
                raise ValueError(f'Invalid environment variable name: {key!r}')
            delimiter = f'RDGEN_{secrets.token_hex(16)}'
            while delimiter in value:
                delimiter = f'RDGEN_{secrets.token_hex(16)}'
            env_file.write(f'{key}<<{delimiter}\n{value}\n{delimiter}\n')

        with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
            env_file.write(f"RDGEN_ASSET_DIR={asset_dir}\n")
            for key, value in secret_values.items():
                if value is not None and value != '':
                    value = str(value)
                    print(f"::add-mask::{escape_workflow_command(value)}")
                    write_multiline_env(env_file, key, value)
        
        print(f"Successfully masked {len(secret_values)} secrets.")