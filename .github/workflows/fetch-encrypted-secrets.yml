name: Fetch Encrypted Secrets

on:
  workflow_call:
    secrets:
      ZIP_PASSWORD:
        required: false
    inputs:
      verify_only:
        type: boolean
        required: false
        default: false
      zip_url_json:
        required: false
        default: ''
        type: string
      zip_b64:
        required: false
        default: ''
        type: string
      bundle_asset_id:
        required: false
        default: ''
        type: string

jobs:
  download-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Install verification bundle dependency
        if: inputs.verify_only
        run: python -m pip install pyzipper==0.4.0
      - name: Create synthetic verification inputs
        if: inputs.verify_only
        shell: python
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          import base64, json, os, uuid
          import pyzipper
          if not os.environ.get('ZIP_PASSWORD'):
              raise SystemExit('ZIP_PASSWORD must be configured for verification')
          values = {
              'server': 'rs-ny.rustdesk.com', 'serverPort': '21116',
              'key': 'OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=',
              'apiServer': 'https://example.invalid',
              'custom': base64.b64encode(b'{}').decode(),
              'uuid': str(uuid.uuid4()),
              'appname': 'rdgenverify', 'filename': 'rdgen-verify',
              'compname': 'RDGen verification', 'rdgen': 'verify',
              'genurl': '', 'CALLBACK_TOKEN': '',
              'urlLink': 'https://rustdesk.com',
              'downloadLink': 'https://rustdesk.com/download',
              'androidappid': 'com.example.rdgenverify',
              'delayFix': 'true', 'xOffline': 'true', 'hidecm': 'true',
              'removeNewVersionNotif': 'true',
              'WEBDAV_URL': '', 'WEBDAV_USER': '', 'WEBDAV_PASS': '',
          }
          for kind in ('icon', 'logo', 'privacy'):
              for suffix in ('url', 'uuid', 'file'):
                  values[f'{kind}link_{suffix}'] = 'false'
          with pyzipper.AESZipFile('secrets.zip', 'w', compression=pyzipper.ZIP_DEFLATED,
                                   encryption=pyzipper.WZ_AES) as bundle:
              bundle.setpassword(os.environ['ZIP_PASSWORD'].encode())
              bundle.writestr('secrets.json', json.dumps(values))
      - name: Decode secrets zip
        if: ${{ !inputs.verify_only }}
        shell: python
        env:
          BUNDLE_ASSET_ID: ${{ inputs.bundle_asset_id }}
          ZIP_B64: ${{ inputs.zip_b64 }}
          ZIP_URL_JSON: ${{ inputs.zip_url_json }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          import json
          import os

          bundle_asset_id = os.environ['BUNDLE_ASSET_ID']
          zip_b64 = os.environ['ZIP_B64']

          if bundle_asset_id:
              import requests

              url = (
                  f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}"
                  f"/releases/assets/{bundle_asset_id}"
              )
              response = requests.get(
                  url,
                  headers={
                      'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                      'Accept': 'application/octet-stream',
                      'X-GitHub-Api-Version': '2026-03-10',
                  },
                  timeout=60,
              )
              response.raise_for_status()
              with open('secrets.zip', 'wb') as f:
                  f.write(response.content)
              print(f"Downloaded private input bundle ({len(response.content)} bytes)")
          elif zip_b64:
              import base64
              zip_bytes = base64.b64decode(zip_b64)
              with open('secrets.zip', 'wb') as f:
                  f.write(zip_bytes)
              print(f"Decoded secrets.zip from base64 ({len(zip_bytes)} bytes)")
          else:
              import requests
              import time

              input_data = json.loads(os.environ['ZIP_URL_JSON'])
              url = f"{input_data['url']}/get_zip?filename={input_data['file']}"

              for attempt in range(5):
                  try:
                      print(f"Downloading (Attempt {attempt + 1})...")
                      r = requests.get(url, timeout=20)
                      r.raise_for_status()
                      with open('secrets.zip', 'wb') as f:
                          f.write(r.content)
                      break
                  except Exception as e:
                      if attempt < 4:
                          time.sleep(5 * (2 ** attempt))
                      else:
                          raise e

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1