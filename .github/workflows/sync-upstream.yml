name: Sync upstream safely
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}
concurrency:
  group: rdgen-upstream-sync
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      base: ${{ steps.compare.outputs.base }}
      upstream: ${{ steps.compare.outputs.upstream }}
      tree: ${{ steps.merge.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install trusted baseline test dependencies
        run: python -m pip install -r requirements.txt PyYAML
      - name: Compare upstream
        id: compare
        shell: bash
        run: |
          git remote add upstream https://github.com/bryangerlach/rdgen.git
          git fetch --no-tags upstream master
          base=$(git rev-parse HEAD)
          upstream=$(git rev-parse FETCH_HEAD)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$upstream" "$base"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Merge upstream into isolated candidate
        id: merge
        if: steps.compare.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.compare.outputs.upstream }}
        run: |
          git config user.name 'rdgen upstream sync'
          git config user.email 'rdgen-sync@users.noreply.github.com'
          git merge --no-ff --no-edit -Xrenormalize "$UPSTREAM_SHA"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Test candidate with network isolated
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          sudo unshare --net -- runuser -u runner -- env -i PATH="$PATH" HOME="$HOME" PYTHONUTF8=1 bash -c '
            set -e
            python manage.py test
            python -m unittest discover -s distribution -p test_store.py
            python -m unittest discover -s distribution -p test_wecom.py
            python -m unittest discover -s distribution -p test_workflows.py
          '

  integrate:
    needs: validate
    if: needs.validate.result == 'success' && needs.validate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.base }}
          fetch-depth: 0
      - name: Integrate only the tested upstream tree
        env:
          UPSTREAM_SHA: ${{ needs.validate.outputs.upstream }}
          EXPECTED_TREE: ${{ needs.validate.outputs.tree }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          git remote add upstream https://github.com/bryangerlach/rdgen.git
          git fetch --no-tags upstream master
          git cat-file -e "${UPSTREAM_SHA}^{commit}"
          git config user.name 'rdgen upstream sync'
          git config user.email 'rdgen-sync@users.noreply.github.com'
          git merge --no-ff --no-edit -Xrenormalize "$UPSTREAM_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"

  notify-failure:
    needs: [validate, integrate]
    if: always() && (needs.validate.result == 'failure' || needs.integrate.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Notify upstream synchronization failure
        uses: ./.github/actions/notify-wecom
        with:
          platform: 上游同步，请查看日志处理冲突或测试失败
          version: upstream
          status: failure
        env:
          WECOM_TASK_LABEL: 同步
          WECHAT_WORK_CORP_ID: ${{ secrets.WECHAT_WORK_CORP_ID }}
          WECHAT_WORK_AGENT_ID: ${{ secrets.WECHAT_WORK_AGENT_ID }}
          WECHAT_WORK_SECRET: ${{ secrets.WECHAT_WORK_SECRET }}
          WECHAT_WORK_TOUSER: ${{ secrets.WECHAT_WORK_TOUSER }}
